<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paula Natalia Rodríguez — Tarjeta digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Playfair+Display:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════
   This is the "Minimal & Elegant" direction from the design canvas,
   built to be a real page: it fills whatever screen it's opened on
   (phone after a QR scan, tablet, desktop) instead of being a fixed
   390px mockup. The card itself caps out at 420px wide and sits
   centered, so it reads the same on every screen size.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:     #FAF8F5;
  --ink:    #201e1d;
  --muted:  #4a4543;
  --quiet:  #8a8683;
  --accent: #700C48;
  --line:   rgba(32,30,29,0.15);
}
*, *::before, *::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Archivo', system-ui, sans-serif;
  display:flex; justify-content:center;
}
a{ color:var(--accent); text-decoration:none; }
a:hover{ color:#520834; }

.card{
  width:100%; max-width:420px;
  min-height:100vh;
  padding:44px 30px 40px;
  display:flex; flex-direction:column;
}

.eyebrow{
  margin:0 0 26px; font-family:'Cormorant Garamond', Georgia, serif;
  font-variant:small-caps; font-size:13px; letter-spacing:0.12em; color:var(--quiet);
}

.portrait{
  width:96px; height:96px; border-radius:50%; overflow:hidden;
  border:1px solid var(--line); margin-bottom:22px;
}
.portrait img{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }

h1{
  margin:0 0 6px; font-family:'Playfair Display', Georgia, serif; font-weight:600;
  font-size:34px; line-height:1.08; letter-spacing:-0.01em;
}
.role{
  margin:0 0 20px; font-family:'Cormorant Garamond', Georgia, serif;
  font-style:italic; font-size:17px; color:var(--accent);
}

.rule{ width:44px; height:1px; background:var(--ink); opacity:0.35; margin-bottom:20px; }

.bio{ margin:0 0 28px; font-size:14px; line-height:1.55; color:var(--muted); max-width:300px; }

.save-btn{
  display:flex; align-items:center; justify-content:center; height:50px;
  border:1px solid var(--accent); color:var(--accent);
  font-size:12px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase;
  margin-bottom:30px;
}
.save-btn:hover{ background:var(--accent); color:#fff; }

.qr-row{ display:flex; align-items:center; gap:16px; margin-bottom:auto; padding-top:4px; }
.qr-box{ width:72px; height:72px; border:1px solid var(--line); padding:6px; flex:none; }
.qr-box img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
.qr-caption{ margin:0; font-family:'Cormorant Garamond', Georgia, serif; font-size:15px; line-height:1.4; color:var(--muted); max-width:160px; }

.credential{
  display:flex; align-items:center; gap:10px;
  padding-top:20px; margin-top:24px; border-top:1px solid rgba(32,30,29,0.12);
}
.credential img{ width:22px; height:23px; object-fit:contain; opacity:0.7; }
.credential p{ margin:0; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--quiet); }

/* On a wide screen (someone opening this from a desktop browser
   rather than a phone), give the centered card a bit of visual
   separation instead of stretching full-height edge to edge. */
@media (min-width:640px){
  body{ background:#EFEBE5; padding:48px 16px; }
  .card{ min-height:0; background:var(--bg); box-shadow:0 20px 60px rgba(32,30,29,0.12); }
}
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Tarjeta digital</p>

  <div class="portrait">
    <img src="images/portrait.png" alt="Paula Natalia Rodríguez">
  </div>

  <h1>Paula Natalia<br>Rodríguez</h1>
  <p class="role">Fisioterapeuta</p>

  <div class="rule"></div>

  <p class="bio">Valoración, rehabilitación y entrenamiento funcional en la comodidad de su casa. Un plan único por paciente.</p>

  <!-- Saves the .vcf contact card below -->
  <a class="save-btn" href="assets/paula-rodriguez.vcf" download="Paula-Natalia-Rodriguez.vcf">Guardar contacto</a>

  <div class="rule"></div>
  <div class="credential">
    <img src="images/logo-uis-black.png" alt="UIS">
    <p>Egresada · Universidad Industrial de Santander</p>
  </div>
</div>

</body>
</html>
